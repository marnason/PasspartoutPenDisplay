name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: PasspartoutPenDisplay
          path: bin/Release/netstandard2.0/PasspartoutPenDisplay.dll
      # Releases are immutable once published, so create a draft, attach the DLL, then publish.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" bin/Release/netstandard2.0/PasspartoutPenDisplay.dll --draft --title "${{ github.ref_name }}" --generate-notes
          gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
